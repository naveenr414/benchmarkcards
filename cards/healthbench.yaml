benchmark_name: "openai_healthbench"
citation: "healthbench"

intended_use_case:
  answer: "LLM performance at providing medical advice given information."

task:

  query_authorship:
    question: "Who created the examples, and what are their backgrounds?"
    answer: >
      262 physicians from 60 countries with backgrounds 26 medical specialties. 

  information_completeness:
    question: "Are examples information-complete?"
    answer: "Partially. Examples generally consist of sufficient detail to at least partially answer the query."

  interaction_type:
    question: "Are examples single or multi-turn?"
    answer: "Single-shot prompts only."

outcome:

  decision_mediation:
    question: "Does the benchmark treat LLM output as the final decision?"
    answer: "Partially. Answers are evaluated based on quality, rather than impact on human behavior."

  outcome_validity:
    question: "What outcome is measured?"
    answer: "Answers are compared with a rubric containing scores for items such as clarity and concision"