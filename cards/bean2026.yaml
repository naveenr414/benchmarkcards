benchmark_name: "nature_ai_medical_assistants"
citation: "bean2026"

intended_use_case:
  answer: "LLM performance in identifying diagnosis and dispositions."

task:

  query_authorship:
    question: "Who created the examples, and what are their backgrounds?"
    answer: >
      Seven physicians with backgrounds in general practice and intensive care,
      who averaged 24 years of experience. Three created questions; four reviewed.

  information_completeness:
    question: "Are examples information-complete?"
    answer: "Yes. All examples contain sufficient information to answer the query."

  interaction_type:
    question: "Are examples single or multi-turn?"
    answer: "Single-shot prompts only."

outcome:

  decision_mediation:
    question: "Does the benchmark treat LLM output as the final decision?"
    answer: "Yes. The LLM decides directly; no human mediator is present."

  outcome_validity:
    question: "What outcome is measured?"
    answer: "Rate at which the LLM selects the correct diagnosis or treatment."